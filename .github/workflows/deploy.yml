name: Test, build and deploy

# Pull requests run the complete quality gate. A push or manual run on main
# continues through the production preflight and both deployments.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_unpublished_release_ledger:
        description: >-
          One-time recovery only: allow a live 404 after verifying that the
          central release ledger has never been published successfully.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: taxsorted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require main for a manual production release
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo 'Manual production releases must run from main.' >&2
            exit 1
          fi

      - name: Require every production credential before release work begins
        if: github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TAX_EXPERT_CANARY_API_KEY: ${{ secrets.TAX_EXPERT_CANARY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HMRC_CLIENT_ID: ${{ secrets.HMRC_CLIENT_ID }}
          HMRC_CLIENT_SECRET: ${{ secrets.HMRC_CLIENT_SECRET }}
          GOV_VENDOR_PUBLIC_IP: ${{ secrets.GOV_VENDOR_PUBLIC_IP }}
        run: |
          set -euo pipefail
          missing=false
          for name in \
            FLY_API_TOKEN \
            TAX_EXPERT_CANARY_API_KEY \
            CLOUDFLARE_API_TOKEN \
            HMRC_CLIENT_ID \
            HMRC_CLIENT_SECRET \
            GOV_VENDOR_PUBLIC_IP
          do
            if [ -z "${!name}" ]; then
              echo "${name} is required for a main-branch release." >&2
              missing=true
            fi
          done
          if [ "${missing}" = true ]; then
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Quality gate — every workspace's tests must pass before anything ships.
      - run: npm test

      - run: npm run lint --workspace frontend

      - run: npm run typecheck

      - run: npm run validate:learn

      - run: npm audit --omit=dev --audit-level=high

      - name: Build frontend with explicit UK professional-opportunity gates
        env:
          UK_PROFESSIONAL_OPPORTUNITIES_PUBLIC_DATA_ENABLED: ${{ vars.UK_PROFESSIONAL_OPPORTUNITIES_PUBLIC_DATA_ENABLED }}
          UK_PROFESSIONAL_OPPORTUNITIES_EMERGENCY_STOP: ${{ vars.UK_PROFESSIONAL_OPPORTUNITIES_EMERGENCY_STOP }}
        run: npm run build

  # The API ships first. A failed or skipped API deploy must never leave a new
  # frontend pointing at an older API contract.
  deploy-api:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test-build, validate-headers]
    outputs:
      professional_opportunities_state: ${{ steps.smoke_public_contracts.outputs.professional_opportunities_state }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Require Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TAX_EXPERT_CANARY_API_KEY: ${{ secrets.TAX_EXPERT_CANARY_API_KEY }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo 'FLY_API_TOKEN is required for a main-branch release.' >&2
            exit 1
          fi
          if [ -z "${TAX_EXPERT_CANARY_API_KEY}" ]; then
            echo 'TAX_EXPERT_CANARY_API_KEY is required to prove workspace inspection and both professional tasks.' >&2
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Record production rollback points before deployment
        timeout-minutes: 7
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cf4198e651bf3009877d49f688c9d88e
          CLOUDFLARE_PAGES_PROJECT: taxsorted
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?FLY_API_TOKEN is required.}"
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required.}"

          fly_status="${RUNNER_TEMP}/fly-status-before.json"
          pages_project="${RUNNER_TEMP}/pages-project-before.json"

          echo 'Capturing the current Fly release and image.'
          for attempt in 1 2 3
          do
            if timeout --signal=TERM --kill-after=5s 45s \
              flyctl status --app taxsorted-api --json >"${fly_status}"
            then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo 'Could not capture the Fly rollback point; refusing to deploy.' >&2
              exit 1
            fi
            echo 'Fly status lookup failed or timed out; retrying the read-only lookup.' >&2
            sleep 3
          done
          fly_target=$(
            jq --compact-output --exit-status '
              [
                .Machines[]
                | {
                    release_version: .config.metadata.fly_release_version,
                    release_id: .config.metadata.fly_release_id,
                    image: .config.image
                  }
              ]
              | unique
              | if length == 1 then .[0]
                else error("Fly Machines do not share one release and image")
                end
              | select(
                  [.release_version, .release_id, .image]
                  | all(type == "string" and length > 0)
                )
            ' "${fly_status}"
          )

          echo 'Capturing the current Cloudflare Pages deployment.'
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 4 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output "${pages_project}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}"

          pages_target=$(
            jq --compact-output --exit-status '
              select(.success == true)
              | .result.canonical_deployment
              | select(
                  .environment == "production"
                  and .latest_stage.status == "success"
                  and ((.id | type) == "string")
                  and ((.id | length) > 0)
                  and ((.url | type) == "string")
                  and (.url | startswith("https://"))
                )
              | {id, url, created_on}
            ' "${pages_project}"
          )

          fly_version=$(jq --raw-output '.release_version' <<<"${fly_target}")
          fly_release_id=$(jq --raw-output '.release_id' <<<"${fly_target}")
          fly_image=$(jq --raw-output '.image' <<<"${fly_target}")
          pages_id=$(jq --raw-output '.id' <<<"${pages_target}")
          pages_url=$(jq --raw-output '.url' <<<"${pages_target}")

          {
            printf '### Production rollback points captured before deployment\n\n'
            printf '| Service | Release or deployment | Rollback target |\n'
            printf '| --- | --- | --- |\n'
            printf '| Fly.io API | `v%s` (`%s`) | `%s` |\n' \
              "${fly_version}" "${fly_release_id}" "${fly_image}"
            printf '| Cloudflare Pages | `%s` | [%s](%s) |\n' \
              "${pages_id}" "${pages_url}" "${pages_url}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Capture the published public-funding change prefix
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/public-funding-changes-before.json"
          prefix="${RUNNER_TEMP}/public-funding-change-prefix.json"
          status=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 --retry 4 --retry-delay 2 --retry-all-errors \
            --header 'Cache-Control: no-cache' \
            --output "${response}" --write-out '%{http_code}' \
            'https://api.taxsorted.io/v1/public-funding/uk/changes?limit=100')
          case "${status}" in
            200)
              jq --exit-status \
                '.schema == "taxsorted.uk.public-funding.changes/1" and .page.hasMore == false and (.data | type == "array")' \
                "${response}" >/dev/null
              jq '.data' "${response}" >"${prefix}"
              ;;
            404)
              if git show HEAD^:api/src/routes/uk-public-funding.ts 2>/dev/null | \
                grep --quiet 'taxsorted.uk.public-funding.changes/1'
              then
                echo 'Published change feed disappeared after its first release; refusing to deploy.' >&2
                exit 1
              fi
              printf '[]\n' >"${prefix}"
              ;;
            *)
              echo "Could not capture published change feed (HTTP ${status}); refusing to deploy." >&2
              exit 1
              ;;
          esac

          candidate='research/uk/public-funding/data/uk-public-funding-release-history.json'
          jq --exit-status \
            'type == "array" and length <= 100' "${candidate}" >/dev/null
          jq --exit-status --slurpfile before "${prefix}" '
            ($before[0]) as $old |
            (length >= ($old | length)) and
            (.[0:($old | length)] == $old)
          ' "${candidate}" >/dev/null

      - name: Require the public release ledger to extend its live prefix
        env:
          PREVIOUS_DEPLOYED_SHA: ${{ github.event.before }}
          ALLOW_UNPUBLISHED_RELEASE_LEDGER: ${{ inputs.allow_unpublished_release_ledger || false }}
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/release-ledger-before.json"
          prefix="${RUNNER_TEMP}/release-checkpoint-prefix.json"
          status=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 --retry 4 --retry-delay 2 --retry-all-errors \
            --header 'Cache-Control: no-cache' \
            --output "${response}" --write-out '%{http_code}' \
            'https://api.taxsorted.io/v1/open-data/releases')
          case "${status}" in
            200)
              jq --exit-status '
                .schema == "taxsorted.open-data-release-ledger/1" and
                (.checkpoints | type == "array")
              ' "${response}" >/dev/null
              jq '.checkpoints' "${response}" >"${prefix}"
              ;;
            404)
              previous_had_contract=false
              if [ "${GITHUB_EVENT_NAME}" = 'push' ]; then
                if [ -z "${PREVIOUS_DEPLOYED_SHA}" ] || \
                   [[ "${PREVIOUS_DEPLOYED_SHA}" =~ ^0+$ ]]
                then
                  echo 'The previous deployed-main SHA is unavailable; refusing a live 404.' >&2
                  exit 1
                fi
                if ! git cat-file -e "${PREVIOUS_DEPLOYED_SHA}^{commit}" 2>/dev/null
                then
                  git fetch --no-tags --depth=1 origin "${PREVIOUS_DEPLOYED_SHA}"
                fi
                if git cat-file -e \
                  "${PREVIOUS_DEPLOYED_SHA}:api/src/release-checkpoints.json" \
                  2>/dev/null
                then
                  previous_had_contract=true
                fi
              fi

              if [ "${previous_had_contract}" = true ]; then
                echo 'Published central release ledger disappeared after its first release; refusing to deploy.' >&2
                echo 'If every earlier ledger deployment failed, verify that fact and use the one-time manual workflow input.' >&2
                exit 1
              fi
              if [ "${GITHUB_EVENT_NAME}" != 'push' ] && \
                 [ "${ALLOW_UNPUBLISHED_RELEASE_LEDGER}" != true ]
              then
                echo 'Manual deployment found no live release ledger; the one-time recovery input is required.' >&2
                exit 1
              fi
              printf '[]\n' >"${prefix}"
              ;;
            *)
              echo "Could not capture published central release ledger (HTTP ${status}); refusing to deploy." >&2
              exit 1
              ;;
          esac

          candidate='api/src/release-checkpoints.json'
          jq --exit-status 'type == "array" and length > 0' "${candidate}" >/dev/null
          jq --exit-status --slurpfile before "${prefix}" '
            ($before[0]) as $old |
            (length >= ($old | length)) and
            (.[0:($old | length)] == $old)
          ' "${candidate}" >/dev/null

      - name: Deploy api to Fly.io
        run: flyctl deploy -c api/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke-test the deployed public contracts
        id: smoke_public_contracts
        env:
          TAX_EXPERT_CANARY_API_KEY: ${{ secrets.TAX_EXPERT_CANARY_API_KEY }}
        run: bash scripts/release/smoke-api.sh

  deploy-frontend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build the exact frontend release
        id: build_frontend
        env:
          UK_PROFESSIONAL_OPPORTUNITIES_PUBLIC_DATA_ENABLED: ${{ vars.UK_PROFESSIONAL_OPPORTUNITIES_PUBLIC_DATA_ENABLED }}
          UK_PROFESSIONAL_OPPORTUNITIES_EMERGENCY_STOP: ${{ vars.UK_PROFESSIONAL_OPPORTUNITIES_EMERGENCY_STOP }}
          API_PROFESSIONAL_OPPORTUNITIES_STATE: ${{ needs.deploy-api.outputs.professional_opportunities_state }}
        run: |
          set -euo pipefail
          requested_open=false
          if [ "${UK_PROFESSIONAL_OPPORTUNITIES_PUBLIC_DATA_ENABLED}" = true ] && \
             { [ -z "${UK_PROFESSIONAL_OPPORTUNITIES_EMERGENCY_STOP}" ] || \
               [ "${UK_PROFESSIONAL_OPPORTUNITIES_EMERGENCY_STOP}" = false ]; }
          then
            requested_open=true
          fi

          frontend_state=closed
          effective_public=false
          effective_stop=true
          if [ "${requested_open}" = true ] && \
             [ "${API_PROFESSIONAL_OPPORTUNITIES_STATE}" = open ]
          then
            frontend_state=open
            effective_public=true
            effective_stop=false
          elif [ "${requested_open}" = true ]
          then
            echo "API atlas is ${API_PROFESSIONAL_OPPORTUNITIES_STATE}; forcing the static atlas closed." >&2
          fi

          UK_PROFESSIONAL_OPPORTUNITIES_PUBLIC_DATA_ENABLED="${effective_public}" \
          UK_PROFESSIONAL_OPPORTUNITIES_EMERGENCY_STOP="${effective_stop}" \
            npm run build
          echo "publication_state=${frontend_state}" >>"${GITHUB_OUTPUT}"

      - name: Verify the generated UK professional-opportunity gate
        env:
          FRONTEND_PROFESSIONAL_OPPORTUNITIES_STATE: ${{ steps.build_frontend.outputs.publication_state }}
        run: |
          set -euo pipefail
          opportunities_page='frontend/out/uk/opportunities/index.html'
          scrutiny_page='frontend/out/uk/regulator-scrutiny/index.html'
          test -f "${opportunities_page}"
          test -f "${scrutiny_page}"
          test -f frontend/out/_worker.js
          test -f frontend/out/_routes.json
          grep --fixed-strings --quiet \
            '"taxsorted.uk.professional-opportunity-edge-gate/1"' \
            frontend/out/_worker.js
          grep --fixed-strings --quiet \
            "\"state\":\"${FRONTEND_PROFESSIONAL_OPPORTUNITIES_STATE}\"" \
            frontend/out/_worker.js
          grep --fixed-strings --quiet \
            '"/uk/opportunities/*"' frontend/out/_routes.json
          grep --fixed-strings --quiet \
            '"/uk/regulator-scrutiny/*"' frontend/out/_routes.json
          if [ "${FRONTEND_PROFESSIONAL_OPPORTUNITIES_STATE}" = open ]
          then
            grep --fixed-strings --quiet \
              'Specialist work, mapped without the sales pitch.' \
              "${opportunities_page}"
            grep --fixed-strings --quiet \
              'Public bodies answer to evidence too.' \
              "${scrutiny_page}"
            for protected_phrase in \
              'Commercial-property fixtures' \
              'Most automated-penalty decisions reviewed in 2025 to 2026 were cancelled'
            do
              if grep --recursive --fixed-strings --quiet \
                "${protected_phrase}" frontend/out/_next/static
              then
                echo "Guarded UK professional-opportunity content leaked into a shared static chunk." >&2
                exit 1
              fi
            done
          else
            grep --fixed-strings --quiet \
              'This research is awaiting its required independent review.' \
              "${opportunities_page}"
            grep --fixed-strings --quiet \
              'This evidence ledger is awaiting its required independent review.' \
              "${scrutiny_page}"
            for protected_phrase in \
              'Commercial-property fixtures' \
              'Most automated-penalty decisions reviewed in 2025 to 2026 were cancelled' \
              'Business rates valuation, property state and list correction' \
              'Schedule 36 information notices and privilege'
            do
              if grep --recursive --fixed-strings --quiet \
                "${protected_phrase}" frontend/out
              then
                echo "Protected UK professional-opportunity content leaked into the closed frontend artifact." >&2
                exit 1
              fi
            done
          fi

      - name: Require Cloudflare deploy token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo 'CLOUDFLARE_API_TOKEN is required for a main-branch release.' >&2
            exit 1
          fi

      - name: Verify the generated people-power doors
        run: |
          set -euo pipefail
          for page_and_marker in \
            'frontend/out/index.html|Pay what the law requires. Claim what the law allows.' \
            'frontend/out/books/index.html|Know where every number came from.' \
            'frontend/out/books/workspace/index.html|TaxSorted does not encrypt or automatically back them up' \
            'frontend/out/checkup/index.html|Find where you stand. Then take the next honest step.' \
            'frontend/out/plan/index.html|See covered lawful choices. Keep the decision yours.' \
            'frontend/out/file/index.html|Nothing moves without your eyes and consent.' \
            'frontend/out/put-it-right/index.html|A mistake is not the end of the road.' \
            'frontend/out/trust/index.html|The boundary should be as visible as the feature.' \
            'frontend/out/learn/index.html|Play the books. Keep the money you can prove.'
          do
            page=${page_and_marker%%|*}
            marker=${page_and_marker#*|}
            test -f "${page}"
            grep --fixed-strings --quiet "${marker}" "${page}"
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: cf4198e651bf3009877d49f688c9d88e
          workingDirectory: frontend
          command: pages deploy out --project-name=taxsorted --branch=main

      - name: Smoke-test the deployed human and machine doors
        env:
          FRONTEND_PROFESSIONAL_OPPORTUNITIES_STATE: ${{ steps.build_frontend.outputs.publication_state }}
        run: bash scripts/release/smoke-frontend.sh

  # HMRC's own Test Fraud Prevention Headers API, sandbox only, checking the
  # exact header-assembly code path production uses before either production
  # system changes.
  validate-headers:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Require HMRC validation credentials
        env:
          HMRC_CLIENT_ID: ${{ secrets.HMRC_CLIENT_ID }}
          HMRC_CLIENT_SECRET: ${{ secrets.HMRC_CLIENT_SECRET }}
          GOV_VENDOR_PUBLIC_IP: ${{ secrets.GOV_VENDOR_PUBLIC_IP }}
        run: |
          set -euo pipefail
          test -n "${HMRC_CLIENT_ID}"
          test -n "${HMRC_CLIENT_SECRET}"
          test -n "${GOV_VENDOR_PUBLIC_IP}"

      - name: Validate fraud-prevention headers against HMRC's Test API
        working-directory: api
        run: npm run validate:fraud-headers
        env:
          HMRC_CLIENT_ID: ${{ secrets.HMRC_CLIENT_ID }}
          HMRC_CLIENT_SECRET: ${{ secrets.HMRC_CLIENT_SECRET }}
          GOV_VENDOR_PUBLIC_IP: ${{ secrets.GOV_VENDOR_PUBLIC_IP }}
